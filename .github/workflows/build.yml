
name: Build Windows portable

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build Windows portable
        shell: cmd
        run: BUILD_WINDOWS.bat < nul

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: NorthDebloater-Windows-Portable
          path: NorthDebloater-Windows-Portable.zip
          if-no-files-found: error
